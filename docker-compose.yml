name: gras-tracker

secrets:
  db_password:
    environment: "POSTGRES_PASSWORD"

services:
  db:
    image: postgres:18-alpine
    container_name: gras_postgres
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gras}
      POSTGRES_DB: ${POSTGRES_DB:-gras}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/18/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gras_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gras} -d ${POSTGRES_DB:-gras}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraper:
    build: .
    container_name: gras_scraper
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      DB_USER: ${POSTGRES_USER:-gras}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-gras}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SCRAPE_INTERVAL_SECONDS: "30"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gras_pgdata:
